<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020817">
  <meta id="metaDescription" name="description" content="Contact SAKKSI — AI designed for the Arab and Francophone world.">
  <title>Contact SAKKSI</title>

  <style>
    :root{
      --bg:#020817;
      --txt:#f6fbff;
      --muted:#bfd4e5;
      --blue:#31c8ff;
      --cyan:#79ecff;
      --line:rgba(88,220,255,.28);
      --line-strong:rgba(88,220,255,.48);
      --shadow:0 0 30px rgba(18,153,255,.18);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; }

    body{
      min-height:100vh;
      font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif;
      color:var(--txt);
      background:var(--bg);
      overflow-x:hidden;
    }

    a{ color:inherit; text-decoration:none; }
    button,input,select,textarea{ font:inherit; }

    .page{
      min-height:100vh;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(2,8,23,.24) 0%, rgba(2,8,23,.40) 38%, rgba(2,8,23,.66) 100%),
        url("djazzair-hero.png") 58% 42% / cover no-repeat;
    }

    .page::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 72% 32%, rgba(29,158,255,.10), transparent 28%),
        radial-gradient(circle at 25% 78%, rgba(49,200,255,.07), transparent 30%);
      pointer-events:none;
    }

    .nav{
      position:relative;
      z-index:10;
      width:min(1440px,94%);
      margin:0 auto;
      min-height:84px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:24px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }



    .nav-actions{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .language-switch{
      display:flex;
      align-items:center;
      gap:0;
      padding:2px;
      border:1px solid rgba(88,220,255,.20);
      border-radius:999px;
      background:rgba(2,8,23,.26);
      backdrop-filter:blur(9px);
    }

    .language-switch button{
      border:0;
      color:#dbeaf6;
      background:transparent;
      cursor:pointer;
      min-width:34px;
      height:30px;
      padding:0 7px;
      border-radius:999px;
      font-size:.78rem;
      font-weight:700;
      transition:.2s;
    }

    .language-switch button.active,
    .language-switch button:hover{
      color:white;
      background:rgba(38,171,255,.18);
      box-shadow:inset 0 0 0 1px rgba(88,220,255,.24);
    }

    .home-btn{
      padding:10px 17px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(2,8,23,.24);
      backdrop-filter:blur(9px);
      box-shadow:var(--shadow);
      color:#eef9ff;
      white-space:nowrap;
      transition:.2s ease;
    }

    .home-btn:hover{
      border-color:var(--line-strong);
      transform:translateY(-1px);
    }

    .contact-wrap{
      position:relative;
      z-index:4;
      width:min(1120px,92%);
      margin:0 auto;
      min-height:calc(100vh - 84px);
      display:grid;
      grid-template-columns:minmax(0, .9fr) minmax(420px, 1.1fr);
      align-items:center;
      gap:56px;
      padding:42px 0 64px;
    }

    .intro{ max-width:520px; }


    .intro h1{
      font-size:clamp(2.3rem,5vw,4.7rem);
      line-height:.98;
      letter-spacing:-.04em;
      margin-bottom:20px;
      text-shadow:0 10px 35px rgba(0,0,0,.34);
    }

    .intro h1 span{
      color:#76ecff;
      text-shadow:0 0 28px rgba(49,200,255,.30);
    }

    .intro p{
      max-width:500px;
      color:#d4e5f1;
      font-size:1.03rem;
      line-height:1.72;
    }
.intro{
  grid-column:2;
  grid-row:1;
}


    .form-card{
      position:relative;
      transform:translate(-10px,-90px);
      overflow:hidden;
      padding:26px;
      border:1px solid rgba(102,232,255,.34);
      border-radius:28px;
      background:
        linear-gradient(145deg,rgba(21,92,150,.08),rgba(3,14,34,.10) 48%,rgba(25,151,210,.06));
      backdrop-filter:blur(10px) saturate(135%);
      -webkit-backdrop-filter:blur(10px) saturate(135%);
      box-shadow:
        inset 0 0 24px rgba(92,226,255,.055),
        0 0 20px rgba(46,190,255,.10),
        0 18px 50px rgba(0,0,0,.16);
    }

    .form-card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(110deg, transparent 0 34%, rgba(126,240,255,.07) 48%, transparent 62%),
        radial-gradient(circle at 18% 8%, rgba(121,236,255,.10), transparent 24%);
      mix-blend-mode:screen;
    }

    .form-card > *{
      position:relative;
      z-index:1;
    }

    .form-card h2{ margin-bottom:6px; font-size:1.35rem; color:#f5fcff; }

    .form-card .form-subtitle{
      margin-bottom:22px;
      color:#bdd2e2;
      font-size:.94rem;
      line-height:1.5;
    }
    .form-card{
  grid-column:1;
  grid-row:1;
}

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .field.full{ grid-column:1 / -1; }

    label{
      color:#dceaf4;
      font-size:.84rem;
      font-weight:600;
    }

    input,select,textarea{
      width:100%;
      border:1px solid rgba(88,220,255,.20);
      border-radius:14px;
      background:rgba(4,18,38,.30);
      color:white;
      outline:none;
      padding:13px 14px;
      transition:.2s;
    }

    input::placeholder,textarea::placeholder{ color:#83a1b8; }
    select option{ background:#061328; color:#fff; }
    textarea{ min-height:150px; resize:vertical; }

    input:focus,select:focus,textarea:focus{
      border-color:rgba(88,220,255,.60);
      box-shadow:0 0 0 3px rgba(49,200,255,.08);
      background:rgba(8,31,58,.42);
    }

    .submit-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-top:18px;
    }

    .privacy-note{
      max-width:310px;
      color:#8fa9bc;
      font-size:.75rem;
      line-height:1.45;
    }

    .submit-btn{
      min-width:150px;
      border:1px solid rgba(121,236,255,.45);
      border-radius:999px;
      padding:13px 22px;
      cursor:pointer;
      font-weight:800;
      color:#03111f;
      background:linear-gradient(135deg,#78ecff,#35bfff);
      box-shadow:0 0 26px rgba(49,200,255,.22);
      transition:.2s ease;
    }

    .submit-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 0 34px rgba(49,200,255,.30);
    }

    .submit-btn:disabled{
      opacity:.55;
      cursor:wait;
      transform:none;
    }

    .status{
      display:none;
      margin-top:15px;
      padding:12px 14px;
      border-radius:14px;
      font-size:.90rem;
      line-height:1.45;
    }

    .status.success{
      display:block;
      color:#dffff5;
      background:rgba(26,160,121,.14);
      border:1px solid rgba(83,233,184,.28);
    }

    .status.error{
      display:block;
      color:#ffe8ea;
      background:rgba(190,55,80,.14);
      border:1px solid rgba(255,120,145,.28);
    }

    .hidden{ display:none !important; }

    [dir="rtl"] .intro,
    [dir="rtl"] .form-card{ text-align:right; }

    /* Keep the same visual composition in Arabic:
       form on the left, presentation on the right. */
    [dir="rtl"] .form-card{
      grid-column:1;
      grid-row:1;
    }

    [dir="rtl"] .intro{
      grid-column:2;
      grid-row:1;
    }

    [dir="rtl"] .nav{
      direction:ltr;
    }

    [dir="rtl"] .nav-actions{
      direction:ltr;
    }

    @media (min-width:701px) and (max-width:1080px){
      .page{
        background:
          linear-gradient(180deg, rgba(2,8,23,.26) 0%, rgba(2,8,23,.42) 42%, rgba(2,8,23,.70) 100%),
          url("vitrine-tablette.png") center center / cover no-repeat;
      }

      .contact-wrap{
        width:min(900px,92%);
        grid-template-columns:1fr;
        gap:30px;
        padding-top:34px;
      }

      .form-card{ width:min(700px,100%); }
      transform:none;
    }

    @media(max-width:700px){
      .page{
        background:
          linear-gradient(180deg, rgba(2,8,23,.30) 0%, rgba(2,8,23,.48) 42%, rgba(2,8,23,.78) 100%),
          url("vitrine-mobile.png") center center / cover no-repeat;
      }

      .nav{ min-height:72px; width:92%; }
      .nav-actions{ gap:8px; }

      .language-switch button{
        min-width:31px;
        height:29px;
        padding:0 5px;
        font-size:.72rem;
      }

      .home-btn{
        padding:9px 13px;
        font-size:.88rem;
      }

      .contact-wrap{
        width:92%;
        min-height:calc(100vh - 72px);
        grid-template-columns:1fr;
        gap:26px;
        padding:30px 0 44px;
      }

      .intro h1{ font-size:clamp(2.2rem,12vw,3.7rem); }
      .intro p{ font-size:.96rem; }

      .form-card{
        padding:19px;
        border-radius:22px;
        transform:none;
      }

      .form-grid{ grid-template-columns:1fr; }
      .field.full{ grid-column:auto; }

      .submit-row{
        align-items:stretch;
        flex-direction:column;
      }

      .privacy-note{ max-width:none; }
      .submit-btn{ width:100%; }
    }
  </style>
</head>

<body>
  <main class="page">
    <nav class="nav">
      <div class="nav-actions">
        <div class="language-switch" aria-label="Language selector">
          <button type="button" class="active" data-lang="en" onclick="setLanguage('en')">EN</button>
          <button type="button" data-lang="ar" onclick="setLanguage('ar')">AR</button>
          <button type="button" data-lang="fr" onclick="setLanguage('fr')">FR</button>
        </div>

        <a class="home-btn" href="index.html" data-i18n="backHome">Home</a>
      </div>
    </nav>

    <section class="contact-wrap">
      <div class="intro">
        <h1>
          <span data-i18n="titleLine1">Let's build</span><br>
          <span data-i18n="titleLine2">the next idea.</span>
        </h1>

        <p data-i18n="intro">
          A question, a project, a partnership or an investment opportunity?
          Send us a message and tell us what you have in mind.
        </p>

      </div>

      <div class="form-card">
        <h2 data-i18n="formTitle">Contact SAKKSI</h2>
        <p class="form-subtitle" data-i18n="formSubtitle">We will get back to you as soon as possible.</p>

        <form id="contactForm">
          <input type="hidden" name="access_key" value="8caec781-0e2b-476f-8bf1-d99e8fd0ccc5">
          <input type="hidden" name="from_name" value="SAKKSI.com Contact">
          <input type="hidden" name="subject" id="hiddenSubject" value="New message from SAKKSI.com">
          <input type="checkbox" name="botcheck" class="hidden" tabindex="-1" autocomplete="off">

          <div class="form-grid">
            <div class="field">
              <label for="name" data-i18n="nameLabel">Name</label>
              <input id="name" name="name" type="text" required autocomplete="name" data-i18n-placeholder="namePlaceholder" placeholder="Your name">
            </div>

            <div class="field">
              <label for="email" data-i18n="emailLabel">Email</label>
              <input id="email" name="email" type="email" required autocomplete="email" data-i18n-placeholder="emailPlaceholder" placeholder="you@example.com">
            </div>

            <div class="field full">
              <label for="category" data-i18n="subjectLabel">Subject</label>
              <select id="category" name="category" required onchange="updateHiddenSubject()">
                <option value="" data-i18n="subjectChoose">Choose a subject</option>
                <option value="General question" data-key="subjectGeneral">General question</option>
                <option value="Partnership" data-key="subjectPartner">Partnership</option>
                <option value="Investor" data-key="subjectInvestor">Investor</option>
                <option value="Business / AI solution" data-key="subjectBusiness">Business / AI solution</option>
                <option value="Press" data-key="subjectPress">Press</option>
                <option value="Other" data-key="subjectOther">Other</option>
              </select>
            </div>

            <div class="field full">
              <label for="message" data-i18n="messageLabel">Message</label>
              <textarea id="message" name="message" required data-i18n-placeholder="messagePlaceholder" placeholder="Tell us about your project or question..."></textarea>
            </div>
          </div>

          <div class="submit-row">
            <p class="privacy-note" data-i18n="privacy">Your details are used only to respond to your message.</p>
            <button class="submit-btn" id="submitBtn" type="submit" data-i18n="send">Send</button>
          </div>

          <div class="status" id="formStatus" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const translations = {
      en:{
        pageTitle:"Contact SAKKSI",
        metaDescription:"Contact SAKKSI — AI designed for the Arab and Francophone world.",
        backHome:"Home",
        eyebrow:"CONTACT • SAKKSI",
        titleLine1:"Let's build",
        titleLine2:"the next idea.",
        intro:"A question, a project, a partnership or an investment opportunity? Send us a message and tell us what you have in mind.",
        formTitle:"Contact SAKKSI",
        formSubtitle:"We will get back to you as soon as possible.",
        nameLabel:"Name",
        namePlaceholder:"Your name",
        emailLabel:"Email",
        emailPlaceholder:"you@example.com",
        subjectLabel:"Subject",
        subjectChoose:"Choose a subject",
        subjectGeneral:"General question",
        subjectPartner:"Partnership",
        subjectInvestor:"Investor",
        subjectBusiness:"Business / AI solution",
        subjectPress:"Press",
        subjectOther:"Other",
        messageLabel:"Message",
        messagePlaceholder:"Tell us about your project or question...",
        privacy:"Your details are used only to respond to your message.",
        send:"Send",
        sending:"Sending...",
        success:"Thank you for your message. It has been sent successfully. We will get back to you as soon as possible.",
        error:"The message could not be sent. Please try again."
      },
      fr:{
        pageTitle:"Contact SAKKSI",
        metaDescription:"Contactez SAKKSI — une IA pensée pour le monde arabe et francophone.",
        backHome:"Accueil",
        eyebrow:"CONTACT • SAKKSI",
        titleLine1:"Construisons",
        titleLine2:"la prochaine idée.",
        intro:"Une question, un projet, une proposition de partenariat ou une opportunité d'investissement ? Envoyez-nous un message et présentez-nous votre idée.",
        formTitle:"Contacter SAKKSI",
        formSubtitle:"Nous vous répondrons dès que possible.",
        nameLabel:"Nom",
        namePlaceholder:"Votre nom",
        emailLabel:"E-mail",
        emailPlaceholder:"vous@exemple.com",
        subjectLabel:"Objet",
        subjectChoose:"Choisissez un objet",
        subjectGeneral:"Question générale",
        subjectPartner:"Partenariat",
        subjectInvestor:"Investisseur",
        subjectBusiness:"Entreprise / solution IA",
        subjectPress:"Presse",
        subjectOther:"Autre",
        messageLabel:"Message",
        messagePlaceholder:"Présentez-nous votre projet ou votre question...",
        privacy:"Vos coordonnées sont utilisées uniquement pour répondre à votre message.",
        send:"Envoyer",
        sending:"Envoi...",
        success:"Merci pour votre message. Il a bien été envoyé. Nous reviendrons vers vous dans les plus brefs délais.",
        error:"Le message n'a pas pu être envoyé. Veuillez réessayer."
      },
      ar:{
        pageTitle:"تواصل مع SAKKSI",
        metaDescription:"تواصل مع SAKKSI — ذكاء اصطناعي صُمم للعالم العربي والناطق بالفرنسية.",
        backHome:"الرئيسية",
        eyebrow:"تواصل • SAKKSI",
        titleLine1:"لنصنع معاً",
        titleLine2:"الفكرة القادمة.",
        intro:"لديك سؤال أو مشروع أو فرصة شراكة أو استثمار؟ أرسل لنا رسالة وشاركنا فكرتك.",
        formTitle:"تواصل مع SAKKSI",
        formSubtitle:"سنرد عليك في أقرب وقت ممكن.",
        nameLabel:"الاسم",
        namePlaceholder:"اسمك",
        emailLabel:"البريد الإلكتروني",
        emailPlaceholder:"you@example.com",
        subjectLabel:"الموضوع",
        subjectChoose:"اختر موضوعاً",
        subjectGeneral:"سؤال عام",
        subjectPartner:"شراكة",
        subjectInvestor:"استثمار",
        subjectBusiness:"شركة / حل ذكاء اصطناعي",
        subjectPress:"صحافة",
        subjectOther:"أخرى",
        messageLabel:"الرسالة",
        messagePlaceholder:"أخبرنا عن مشروعك أو سؤالك...",
        privacy:"تُستخدم بياناتك فقط للرد على رسالتك.",
        send:"إرسال",
        sending:"جارٍ الإرسال...",
        success:"شكراً لرسالتك. تم إرسالها بنجاح. سنتواصل معك في أقرب وقت ممكن.",
        error:"تعذر إرسال الرسالة. يرجى المحاولة مرة أخرى."
      }
    };

    let currentLanguage = "en";

    function setLanguage(lang){
      if(!translations[lang]) return;
      currentLanguage = lang;
      localStorage.setItem("sakksi-language", lang);
      const t = translations[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = t.pageTitle;
      document.getElementById("metaDescription").setAttribute("content", t.metaDescription);

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if(t[key] !== undefined) el.textContent = t[key];
      });

      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if(t[key] !== undefined) el.placeholder = t[key];
      });

      document.querySelectorAll(".language-switch button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });

      document.querySelectorAll("#category option[data-key]").forEach(option => {
        const key = option.dataset.key;
        if(t[key] !== undefined) option.textContent = t[key];
      });

      updateHiddenSubject();
    }

    function updateHiddenSubject(){
      const category = document.getElementById("category");
      const hiddenSubject = document.getElementById("hiddenSubject");

      if(category && category.selectedIndex > 0){
        const selectedText = category.options[category.selectedIndex].textContent.trim();
        hiddenSubject.value = "SAKKSI.com — " + selectedText;
      }else{
        hiddenSubject.value = "New message from SAKKSI.com";
      }
    }

    document.getElementById("contactForm").addEventListener("submit", async function(event){
      event.preventDefault();

      const form = event.currentTarget;
      const button = document.getElementById("submitBtn");
      const status = document.getElementById("formStatus");
      const t = translations[currentLanguage];

      status.className = "status";
      status.textContent = "";
      button.disabled = true;
      button.textContent = t.sending;

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try{
        const response = await fetch("https://api.web3forms.com/submit", {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },
          body:JSON.stringify(payload)
        });

        const result = await response.json();

        if(result.success){
          status.className = "status success";
          status.textContent = t.success;
          form.reset();
          updateHiddenSubject();
        }else{
          throw new Error(result.message || "Web3Forms error");
        }
      }catch(error){
        status.className = "status error";
        status.textContent = t.error;
      }finally{
        button.disabled = false;
        button.textContent = t.send;
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      const savedLanguage = localStorage.getItem("sakksi-language");
      setLanguage(savedLanguage && translations[savedLanguage] ? savedLanguage : "en");
    });
  </script>
</body>
</html>
