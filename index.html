<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020817">
  <meta id="metaDescription" name="description" content="SAKKSI.com — AI designed for the Arab and Francophone world.">
  <title>SAKKSI.com — AI Assistant</title>

  <style>
    :root{
      --bg:#020817;
      --txt:#f6fbff;
      --muted:#c1d5e5;
      --blue:#31c8ff;
      --cyan:#79ecff;
      --line:rgba(88,220,255,.28);
      --shadow:0 0 30px rgba(18,153,255,.18);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html{ scroll-behavior:smooth; }

    body{
      font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif;
      background:var(--bg);
      color:var(--txt);
      overflow-x:hidden;
    }

    a{ color:inherit; text-decoration:none; }
    button,input{ font:inherit; }

    .hero{
      min-height:100vh;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(2,8,23,.10) 0%, rgba(2,8,23,.06) 25%, rgba(2,8,23,.14) 65%, rgba(2,8,23,.42) 100%),
        url("djazzair-hero.png") center center / cover no-repeat;
    }

    .nav{
      position:relative;
      z-index:10;
      width:min(1440px,94%);
      margin:0 auto;
      min-height:84px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:26px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .menu{
      display:flex;
      align-items:center;
      gap:38px;
      color:#eef8ff;
      font-size:1rem;
      text-shadow:0 0 12px rgba(0,0,0,.28);
    }

    .menu a{
      position:relative;
      opacity:.94;
      white-space:nowrap;
      transition:.2s;
    }

    .menu a:hover{ opacity:1; }

    .menu a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-10px;
      height:2px;
      transform:scaleX(0);
      transition:.2s;
      background:linear-gradient(90deg,var(--blue),var(--cyan));
      box-shadow:0 0 15px rgba(49,200,255,.7);
    }

    .menu a:hover::after{ transform:scaleX(1); }

    .nav-actions{
      position:absolute;
      right:0;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .language-switch{
      display:flex;
      gap:4px;
      padding:4px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(2,8,23,.24);
      backdrop-filter:blur(9px);
      box-shadow:var(--shadow);
    }

    .language-switch button{
      border:0;
      color:#dbeaf6;
      background:transparent;
      cursor:pointer;
      min-width:38px;
      height:32px;
      padding:0 9px;
      border-radius:999px;
      font-size:.83rem;
      font-weight:700;
      transition:.2s;
    }

    .language-switch button.active,
    .language-switch button:hover{
      color:white;
      background:rgba(38,171,255,.18);
      box-shadow:inset 0 0 0 1px rgba(88,220,255,.24);
    }

    .login{
      padding:11px 19px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(2,8,23,.18);
      backdrop-filter:blur(9px);
      box-shadow:var(--shadow);
      white-space:nowrap;
    }

    .hero-stage{
      position:relative;
      z-index:3;
      min-height:calc(100vh - 84px);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:0 18px 26px;
    }

    .dock-wrap{
      width:min(1320px,98%);
      position:relative;
      z-index:8;
    }

    .service-dock{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
      align-items:flex-end;
    }

    .service-item{
      position:relative;
    }

    .service-pill{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:54px;
      padding:11px 17px;
      border-radius:999px;
      border:1px solid rgba(88,220,255,.28);
      background:linear-gradient(180deg, rgba(4,16,40,.18), rgba(4,16,40,.30));
      backdrop-filter:blur(12px);
      color:#eff9ff;
      cursor:pointer;
      box-shadow:0 0 20px rgba(8,115,255,.10);
      transition:.22s ease;
    }

    .service-pill:hover,
    .service-item.open .service-pill{
      transform:translateY(-2px);
      border-color:rgba(88,220,255,.58);
      background:linear-gradient(180deg, rgba(4,16,40,.28), rgba(4,16,40,.40));
      box-shadow:0 0 28px rgba(8,115,255,.18);
    }

    .service-pill .icon{
      width:30px;
      height:30px;
      border-radius:10px;
      display:grid;
      place-items:center;
      background:rgba(38,171,255,.10);
      color:var(--cyan);
      font-size:1rem;
      flex:0 0 auto;
    }

    .service-pill .label{
      white-space:nowrap;
      font-size:.93rem;
    }

    .service-panel{
      position:absolute;
      left:50%;
      bottom:68px;
      width:280px;
      transform:translateX(-50%) translateY(12px) scale(.97);
      opacity:0;
      pointer-events:none;
      padding:15px 17px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(3,15,36,.22), rgba(3,15,36,.40));
      border:1px solid rgba(88,220,255,.28);
      backdrop-filter:blur(14px);
      box-shadow:0 0 28px rgba(0,140,255,.13);
      transition:opacity .22s ease, transform .22s ease;
    }

    .service-item.open .service-panel{
      opacity:1;
      pointer-events:auto;
      transform:translateX(-50%) translateY(0) scale(1);
    }

    .service-panel::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-8px;
      width:14px;
      height:14px;
      transform:translateX(-50%) rotate(45deg);
      background:rgba(3,15,36,.34);
      border-right:1px solid rgba(88,220,255,.24);
      border-bottom:1px solid rgba(88,220,255,.24);
    }

    .service-panel strong{
      display:block;
      margin-bottom:6px;
      color:#89ecff;
      font-size:.98rem;
    }

    .service-panel p{
      color:#d5e8f4;
      font-size:.90rem;
      line-height:1.5;
    }

    .saksi-launcher{
      position:fixed;
      right:24px;
      bottom:24px;
      z-index:40;
      display:flex;
      align-items:center;
      gap:12px;
      border:none;
      border-radius:999px;
      padding:10px 16px 10px 10px;
      cursor:pointer;
      color:white;
      background:linear-gradient(180deg, rgba(4,17,40,.84), rgba(4,17,40,.94));
      border:1px solid rgba(88,220,255,.34);
      backdrop-filter:blur(12px);
      box-shadow:0 0 28px rgba(18,153,255,.16);
    }

    .orb{
      width:44px;
      height:44px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-weight:800;
      color:#06111f;
      background:radial-gradient(circle at 30% 30%, #f0ffff, #56eaff 35%, #1d9eff 70%, #092865);
      box-shadow:0 0 26px rgba(75,222,255,.75);
    }

    .saksi-launcher strong{
      display:block;
      color:#73ecff;
      text-align:left;
      font-size:.98rem;
    }

    .saksi-launcher small{
      display:block;
      text-align:left;
      color:#b7d0e2;
      font-size:.89rem;
    }

    .saksi-hologram{
      position:fixed;
      right:2vw;
      bottom:0;
      width:min(42vw,620px);
      max-height:88vh;
      object-fit:contain;
      object-position:bottom right;
      z-index:28;
      opacity:0;
      pointer-events:none;
      transform:translateY(80px) scale(.88);
      filter:
        drop-shadow(0 0 18px rgba(55,217,255,.75))
        drop-shadow(0 0 50px rgba(0,116,255,.38));
      transition:opacity .45s ease, transform .55s cubic-bezier(.2,.9,.2,1);
    }

    .saksi-hologram.show{
      opacity:1;
      transform:translateY(0) scale(1);
      animation:holoFloat 3.6s ease-in-out infinite alternate;
    }

    .saksi-beam{
      position:fixed;
      right:10vw;
      bottom:12px;
      width:min(28vw,420px);
      height:70px;
      z-index:27;
      border-radius:50%;
      background:
        radial-gradient(ellipse at center,
          rgba(102,237,255,.50) 0%,
          rgba(30,171,255,.22) 36%,
          rgba(0,91,255,.05) 62%,
          transparent 74%);
      filter:blur(5px);
      opacity:0;
      pointer-events:none;
      transform:scale(.55);
      transition:.45s ease;
    }

    .saksi-beam.show{
      opacity:1;
      transform:scale(1);
      animation:beamPulse 1.8s ease-in-out infinite alternate;
    }

    .chatbox{
      position:fixed;
      right:clamp(86px, 14vw, 180px);
      bottom:24px;
      width:min(300px, calc(100vw - 32px));
      background:linear-gradient(180deg, rgba(2,12,30,.06), rgba(2,12,30,.20));
      border:1px solid rgba(67,211,255,.28);
      border-radius:22px;
      box-shadow:0 0 22px rgba(0,130,255,.09);
      backdrop-filter:blur(8px);
      overflow:hidden;
      transform:translateY(15px) scale(.98);
      opacity:0;
      pointer-events:none;
      transition:.25s;
      z-index:29;
    }

    .chatbox.open{
      transform:none;
      opacity:1;
      pointer-events:auto;
    }

    .chat-head{
      padding:10px 14px 6px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.04);
    }

    .chat-head strong{
      color:#79e9ff;
      letter-spacing:.08em;
      font-size:.90rem;
    }

    .close{
      border:0;
      background:transparent;
      color:#d7e8f5;
      font-size:1.35rem;
      cursor:pointer;
    }

    .chat-body{
      padding:10px 14px;
      min-height:72px;
    }

    .bubble{
      max-width:100%;
      padding:12px 14px;
      background:rgba(28,155,255,.04);
      border:1px solid rgba(52,196,255,.20);
      border-radius:14px 14px 14px 4px;
      color:#eefbff;
      line-height:1.45;
      font-size:.95rem;
    }

    .chat-input{
      display:flex;
      gap:8px;
      padding:10px 12px 12px;
      border-top:1px solid rgba(255,255,255,.05);
    }

    .chat-input input{
      flex:1;
      border:1px solid rgba(80,201,255,.24);
      background:rgba(7,24,45,.34);
      color:white;
      border-radius:12px;
      padding:11px 12px;
      outline:none;
    }

    .chat-input button{
      width:46px;
      border:0;
      border-radius:12px;
      cursor:pointer;
      background:linear-gradient(135deg,#168cff,#42deff);
      color:white;
      font-size:1.1rem;
    }

    [dir="rtl"] .saksi-launcher strong,
    [dir="rtl"] .saksi-launcher small{
      text-align:right;
    }

    [dir="rtl"] .bubble{
      text-align:right;
      border-radius:14px 14px 4px 14px;
    }

    @keyframes holoFloat{
      from{ transform:translateY(0) scale(1); }
      to{ transform:translateY(-10px) scale(1.008); }
    }

    @keyframes beamPulse{
      from{ filter:blur(5px); opacity:.6; }
      to{ filter:blur(9px); opacity:1; }
    }

    .mobile-menu-btn{
      display:none;
      width:44px;
      height:44px;
      border-radius:12px;
      border:1px solid rgba(88,220,255,.28);
      background:rgba(2,8,23,.22);
      color:white;
      font-size:1.45rem;
      cursor:pointer;
      backdrop-filter:blur(8px);
      align-items:center;
      justify-content:center;
    }

    .mobile-menu{
      display:none;
      position:absolute;
      top:76px;
      right:4%;
      z-index:60;
      width:min(280px,88vw);
      padding:14px;
      border-radius:18px;
      background:rgba(3,14,34,.90);
      border:1px solid rgba(88,220,255,.25);
      backdrop-filter:blur(18px);
      box-shadow:
        0 15px 45px rgba(0,0,0,.35),
        0 0 25px rgba(0,130,255,.12);
    }

    .mobile-menu.open{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .mobile-menu a{
      padding:12px 14px;
      border-radius:12px;
      color:#edf9ff;
    }

    .mobile-menu a:hover{
      background:rgba(38,171,255,.12);
    }

    .mobile-language-switch{
      display:flex;
      gap:8px;
      margin-top:8px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .mobile-language-switch button{
      flex:1;
      padding:10px;
      border-radius:10px;
      border:1px solid rgba(88,220,255,.22);
      background:rgba(38,171,255,.08);
      color:white;
      cursor:pointer;
    }

    .mobile-language-switch button.active{
      background:rgba(38,171,255,.20);
      border-color:rgba(88,220,255,.45);
    }

    @media (min-width:701px) and (max-width:1080px){
      .hero{
        background:
          linear-gradient(180deg, rgba(2,8,23,.10) 0%, rgba(2,8,23,.06) 20%, rgba(2,8,23,.16) 62%, rgba(2,8,23,.48) 100%),
          url("vitrine-tablette.png") center center / cover no-repeat;
      }

      .menu{ display:none; }
      .mobile-menu-btn{ display:flex; }

      .nav{
        min-height:76px;
        justify-content:flex-end;
      }

      .nav-actions{
        position:static;
      }

      .hero-stage{
        min-height:calc(100vh - 76px);
      }

      .service-dock{
        justify-content:flex-start;
        flex-wrap:nowrap;
        overflow-x:auto;
        padding:4px 0;
        scrollbar-width:none;
      }

      .service-dock::-webkit-scrollbar{ display:none; }
      .service-item{ flex:0 0 auto; }
    }

    @media(max-width:700px){
      .hero{
        background:
          linear-gradient(180deg, rgba(2,8,23,.10) 0%, rgba(2,8,23,.06) 18%, rgba(2,8,23,.18) 62%, rgba(2,8,23,.52) 100%),
          url("vitrine-mobile.png") center center / cover no-repeat;
      }

      .menu,
      .language-switch,
      .login{
        display:none;
      }

      .mobile-menu-btn{
        display:flex;
      }

      .nav{
        min-height:72px;
        justify-content:flex-end;
      }

      .nav-actions{
        position:static;
      }

      .hero-stage{
        min-height:calc(100vh - 72px);
        padding:0 10px 96px;
      }

      .service-dock{
        justify-content:flex-start;
        flex-wrap:nowrap;
        overflow-x:auto;
        gap:9px;
        padding:4px 2px;
        scrollbar-width:none;
      }

      .service-dock::-webkit-scrollbar{ display:none; }

      .service-item{
        flex:0 0 auto;
      }

      .service-pill{
        min-height:46px;
        padding:8px 12px;
      }

      .service-pill .label{
        font-size:.84rem;
      }

      .service-panel{
        width:240px;
        bottom:60px;
      }

      .saksi-launcher{
        right:12px;
        bottom:12px;
        padding:8px;
      }

      .saksi-launcher span{
        display:none;
      }

      .saksi-hologram{
        right:-14vw;
        width:88vw;
        max-height:72vh;
      }

      .saksi-hologram.show{
        opacity:.95;
      }

      .saksi-beam{
        right:5vw;
        width:70vw;
      }

      .chatbox{
        right:10px;
        bottom:82px;
        width:min(90vw,300px);
      }

      .mobile-menu{
        top:72px;
        right:12px;
      }

      [dir="rtl"] .mobile-menu{
        right:auto;
        left:12px;
      }
    }
  </style>
</head>

<body>

  <header class="hero" id="home">
    <nav class="nav">
      <div class="menu">
        <a href="#home" data-i18n="navHome">Home</a>
        <a href="#services" data-i18n="navProducts">Products</a>
        <a href="#solutions" data-i18n="navSolutions">Solutions</a>
        <a href="#resources" data-i18n="navResources">Resources</a>
        <a href="#investors" data-i18n="navInvestors">Investors</a>
      </div>

      <div class="nav-actions">
        <div class="language-switch" aria-label="Language selector">
          <button type="button" class="active" data-lang="en" onclick="setLanguage('en')">EN</button>
          <button type="button" data-lang="ar" onclick="setLanguage('ar')">AR</button>
          <button type="button" data-lang="fr" onclick="setLanguage('fr')">FR</button>
        </div>

        <a class="login" href="#contact" data-i18n="contact">Contact</a>
        <button class="mobile-menu-btn" type="button" onclick="toggleMobileMenu()" aria-label="Menu">☰</button>
      </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
      <a href="#home" data-i18n="navHome">Home</a>
      <a href="#services" data-i18n="navProducts">Products</a>
      <a href="#solutions" data-i18n="navSolutions">Solutions</a>
      <a href="#resources" data-i18n="navResources">Resources</a>
      <a href="#investors" data-i18n="navInvestors">Investors</a>
      <a href="#contact" data-i18n="contact">Contact</a>

      <div class="mobile-language-switch">
        <button type="button" data-lang="en" onclick="setLanguage('en')">EN</button>
        <button type="button" data-lang="ar" onclick="setLanguage('ar')">AR</button>
        <button type="button" data-lang="fr" onclick="setLanguage('fr')">FR</button>
      </div>
    </div>

    <div class="hero-stage">
      <div class="dock-wrap" id="services">
        <div class="service-dock">

          <div class="service-item">
            <button class="service-pill" type="button" data-service="chat" onclick="toggleService(this)">
              <span class="icon">💬</span>
              <span class="label" data-i18n="serviceChat">AI Chat</span>
            </button>
            <div class="service-panel">
              <strong class="service-panel-title"></strong>
              <p class="service-panel-text"></p>
            </div>
          </div>

          <div class="service-item">
            <button class="service-pill" type="button" data-service="content" onclick="toggleService(this)">
              <span class="icon">✦</span>
              <span class="label" data-i18n="serviceContent">Content Creation</span>
            </button>
            <div class="service-panel">
              <strong class="service-panel-title"></strong>
              <p class="service-panel-text"></p>
            </div>
          </div>

          <div class="service-item">
            <button class="service-pill" type="button" data-service="data" onclick="toggleService(this)">
              <span class="icon">▥</span>
              <span class="label" data-i18n="serviceData">Data Analysis</span>
            </button>
            <div class="service-panel">
              <strong class="service-panel-title"></strong>
              <p class="service-panel-text"></p>
            </div>
          </div>

          <div class="service-item">
            <button class="service-pill" type="button" data-service="automation" onclick="toggleService(this)">
              <span class="icon">⚙</span>
              <span class="label" data-i18n="serviceAutomation">Automation</span>
            </button>
            <div class="service-panel">
              <strong class="service-panel-title"></strong>
              <p class="service-panel-text"></p>
            </div>
          </div>

          <div class="service-item">
            <button class="service-pill" type="button" data-service="custom" onclick="toggleService(this)">
              <span class="icon">◇</span>
              <span class="label" data-i18n="serviceCustom">Custom Solutions</span>
            </button>
            <div class="service-panel">
              <strong class="service-panel-title"></strong>
              <p class="service-panel-text"></p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </header>

  <div class="saksi-beam" id="saksiBeam"></div>

  <img
    src="saksi-hologram.png"
    alt="SAKKSI holographic AI assistant"
    class="saksi-hologram"
    id="saksiHologram"
  >

  <div class="chatbox" id="chatbox">
    <div class="chat-head">
      <strong data-i18n="chatHeader">SAKKSI • AI ASSISTANT</strong>
      <button class="close" type="button" onclick="closeSaksi()">×</button>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="bubble" id="welcomeBubble">
        Hello, I am <strong>SAKKSI</strong>.<br>
        How can I help you today?
      </div>
    </div>

    <form class="chat-input" onsubmit="demoMessage(event)">
      <input id="chatInput" type="text" placeholder="Ask your question…" autocomplete="off">
      <button type="submit">➤</button>
    </form>
  </div>

  <button class="saksi-launcher" type="button" onclick="toggleSaksi()" aria-label="Open SAKKSI">
    <div class="orb">S</div>
    <span>
      <strong>SAKKSI</strong>
      <small data-i18n="assistantLabel">Your AI assistant</small>
    </span>
  </button>

  <script>
    const translations = {
      en: {
        pageTitle: "SAKKSI.com — AI Assistant",
        metaDescription: "SAKKSI.com — AI designed for the Arab and Francophone world.",
        navHome: "Home",
        navProducts: "Products",
        navSolutions: "Solutions",
        navResources: "Resources",
        navInvestors: "Investors",
        contact: "Contact",
        serviceChat: "AI Chat",
        serviceContent: "Content Creation",
        serviceData: "Data Analysis",
        serviceAutomation: "Automation",
        serviceCustom: "Custom Solutions",
        chatHeader: "SAKKSI • AI ASSISTANT",
        assistantLabel: "Your AI assistant",
        chatPlaceholder: "Ask your question…",
        welcome: 'Hello, I am <strong>SAKKSI</strong>.<br>How can I help you today?',
        demoReply: "SAKKSI is ready. This interface can now be connected to a real AI engine.",
        services: {
          chat:{ title:"AI Chat", text:"Fast, contextual and natural answers." },
          content:{ title:"Content Creation", text:"Generate text, ideas and visual concepts for your projects." },
          data:{ title:"Data Analysis", text:"Turn your data into useful, understandable insights." },
          automation:{ title:"Automation", text:"Automate repetitive work and save valuable time." },
          custom:{ title:"Custom Solutions", text:"AI solutions adapted to your organization and objectives." }
        }
      },

    let currentLanguage = "en";

    const chatbox = document.getElementById("chatbox");
    const saksiHologram = document.getElementById("saksiHologram");
    const saksiBeam = document.getElementById("saksiBeam");
    const welcomeBubble = document.getElementById("welcomeBubble");
    const chatInput = document.getElementById("chatInput");

    function updateServicePanels(){
      document.querySelectorAll(".service-item").forEach(item => {
        const button = item.querySelector(".service-pill");
        const key = button.dataset.service;
        const service = translations[currentLanguage].services[key];

        item.querySelector(".service-panel-title").textContent = service.title;
        item.querySelector(".service-panel-text").textContent = service.text;
      });
    }

    function toggleService(button){
      const currentItem = button.closest(".service-item");

      document.querySelectorAll(".service-item").forEach(item => {
        if(item !== currentItem){
          item.classList.remove("open");
        }
      });

      currentItem.classList.toggle("open");
    }

    function setLanguage(lang){
      if(!translations[lang]) return;

      currentLanguage = lang;
      localStorage.setItem("sakksi-language", lang);

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = translations[lang].pageTitle;

      document
        .getElementById("metaDescription")
        .setAttribute("content", translations[lang].metaDescription);

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if(translations[lang][key] !== undefined){
          el.textContent = translations[lang][key];
        }
      });

      document
        .querySelectorAll(".language-switch button, .mobile-language-switch button")
        .forEach(btn => {
          btn.classList.toggle("active", btn.dataset.lang === lang);
        });

      welcomeBubble.innerHTML = translations[lang].welcome;
      chatInput.placeholder = translations[lang].chatPlaceholder;

      updateServicePanels();

      const mobileMenu = document.getElementById("mobileMenu");
      if(mobileMenu){
        mobileMenu.classList.remove("open");
      }
    }

    function toggleMobileMenu(){
      const mobileMenu = document.getElementById("mobileMenu");
      if(mobileMenu){
        mobileMenu.classList.toggle("open");
      }
    }

    document.querySelectorAll("#mobileMenu a").forEach(link => {
      link.addEventListener("click", () => {
        document.getElementById("mobileMenu").classList.remove("open");
      });
    });

    function showHologram(){
      saksiHologram.classList.add("show");
      saksiBeam.classList.add("show");
    }

    function hideHologram(){
      saksiHologram.classList.remove("show");
      saksiBeam.classList.remove("show");
    }

    function openSaksi(){
      showHologram();
      setTimeout(() => {
        chatbox.classList.add("open");
      }, 320);
    }

    function closeSaksi(){
      chatbox.classList.remove("open");
      hideHologram();
    }

    function toggleSaksi(){
      if(chatbox.classList.contains("open")){
        closeSaksi();
      }else{
        openSaksi();
      }
    }

    function demoMessage(event){
      event.preventDefault();

      const body = document.getElementById("chatBody");
      const message = chatInput.value.trim();

      if(!message) return;

      const user = document.createElement("div");
      user.style.margin = "12px 0 0 auto";
      user.style.maxWidth = "90%";
      user.style.padding = "12px 14px";
      user.style.borderRadius = "14px 14px 4px 14px";
      user.style.background = "linear-gradient(135deg,#157fdc,#21c6e8)";
      user.style.color = "#fff";
      user.style.fontSize = ".95rem";
      user.style.direction = currentLanguage === "ar" ? "rtl" : "ltr";
      user.textContent = message;

      body.appendChild(user);
      chatInput.value = "";

      setTimeout(() => {
        const reply = document.createElement("div");
        reply.className = "bubble";
        reply.style.marginTop = "12px";
        reply.style.direction = currentLanguage === "ar" ? "rtl" : "ltr";
        reply.textContent = translations[currentLanguage].demoReply;

        body.appendChild(reply);
        body.scrollTop = body.scrollHeight;
      }, 450);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedLanguage = localStorage.getItem("sakksi-language");

      setLanguage(
        savedLanguage && translations[savedLanguage]
          ? savedLanguage
          : "en"
      );

      updateServicePanels();
    });
  </script>
